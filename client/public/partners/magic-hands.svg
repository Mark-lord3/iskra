<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200"
     role="img" aria-label="Abstract warm artwork: two soft light forms leaning toward each other over a dark ground, meeting at a single point of concentrated light">
  <defs>
    <!-- Ground: near-black charcoal, #1d1216 falling to #0d0809. -->
    <linearGradient id="ground" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#1d1216"/>
      <stop offset="0.52" stop-color="#150d10"/>
      <stop offset="1"    stop-color="#0d0809"/>
    </linearGradient>

    <!-- One soft directional source from the upper right, long gentle falloff. -->
    <radialGradient id="keyLight" cx="0.80" cy="0.16" r="0.92">
      <stop offset="0"    stop-color="#e8875a" stop-opacity="0.30"/>
      <stop offset="0.34" stop-color="#e8875a" stop-opacity="0.13"/>
      <stop offset="0.72" stop-color="#e8875a" stop-opacity="0.03"/>
      <stop offset="1"    stop-color="#e8875a" stop-opacity="0"/>
    </radialGradient>

    <!-- The two forms. Warmer toward the point where they nearly meet. -->
    <radialGradient id="formLower" cx="0.72" cy="0.30" r="0.78">
      <stop offset="0"    stop-color="#f3c39c" stop-opacity="0.62"/>
      <stop offset="0.38" stop-color="#e8875a" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#e8875a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="formUpper" cx="0.26" cy="0.72" r="0.80">
      <stop offset="0"    stop-color="#f3c39c" stop-opacity="0.55"/>
      <stop offset="0.40" stop-color="#e8875a" stop-opacity="0.26"/>
      <stop offset="1"    stop-color="#e8875a" stop-opacity="0"/>
    </radialGradient>

    <!-- Volumetric haze pooled low and right, where the weight sits. -->
    <radialGradient id="haze" cx="0.66" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#e8875a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e8875a" stop-opacity="0"/>
    </radialGradient>

    <filter id="softA" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="contact" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Fine film grain, desaturated and held well under the image. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="url(#ground)"/>
  <rect width="1800" height="1200" fill="url(#keyLight)"/>
  <rect width="1800" height="1200" fill="url(#haze)"/>

  <!-- Lower form: rises from the lower left, leaning up toward the contact point.
       Its centre sits inside the 8% safe area. -->
  <g filter="url(#softA)">
    <ellipse cx="700" cy="950" rx="320" ry="132" fill="url(#formLower)"
             transform="rotate(-36 700 950)"/>
  </g>

  <!-- Upper form: descends from the right, leaning down to meet it. A gap of
       roughly 90px is left between them: they approach, they do not touch. -->
  <g filter="url(#softB)">
    <ellipse cx="1380" cy="450" rx="260" ry="112" fill="url(#formUpper)"
             transform="rotate(-36 1380 450)"/>
  </g>

  <!-- The single point of concentrated light where the two nearly meet. -->
  <g filter="url(#contact)">
    <circle cx="1040" cy="700" r="104" fill="#e8875a" opacity="0.30"/>
    <circle cx="1040" cy="700" r="44" fill="#f3c39c" opacity="0.46"/>
  </g>
  <circle cx="1040" cy="700" r="10" fill="#ffe6d3" opacity="0.92"/>
  <circle cx="1040" cy="700" r="3.5" fill="#ffe6d3"/>

  <!-- Grain last, so it sits over the gradients rather than under them. -->
  <rect width="1800" height="1200" filter="url(#grain)" opacity="0.055"/>
</svg>
