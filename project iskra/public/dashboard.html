<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Project Iskra - My Tickets</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23e63946'/><text x='16' y='23' font-size='20' font-weight='bold' fill='white' text-anchor='middle'>I</text></svg>">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="stylesheet" href="dashboard.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="site-nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                <svg viewBox="0 0 100 100" class="nav-logo-icon">
                    <defs>
                        <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="url(#sparkGrad)"/>
                </svg>
                <span class="nav-logo-text">PROJECT <strong>ISKRA</strong></span>
            </a>
            <div class="nav-links">
                <a href="/#events" class="nav-link" data-i18n="nav-events">EVENTS</a>
                <a href="/#gallery" class="nav-link" data-i18n="nav-gallery">GALLERY</a>
                <a href="/#about" class="nav-link" data-i18n="nav-about">ABOUT</a>
                <a href="/#community" class="nav-link" data-i18n="nav-contact">CONTACT</a>
            </div>
            <div class="nav-right">
                <div class="lang-switcher-nav">
                    <button class="lang-btn-nav active" data-lang="uk">УК</button>
                    <button class="lang-btn-nav" data-lang="en">EN</button>
                </div>
                <div class="nav-auth">
                    <a href="/" class="nav-btn-login" data-i18n="btn-home">Головна</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dash-content">

        <div class="email-gate" id="emailGate">
            <div class="container">
                <div class="gate-card">
                    <div class="gate-icon">
                        <svg viewBox="0 0 100 100" width="48" height="48" opacity="0.2">
                            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#e63946"/>
                        </svg>
                    </div>
                    <h2 class="gate-title" data-i18n="gate-title">MY TICKETS</h2>
                    <p class="gate-desc" data-i18n="gate-desc">Enter your email to access your tickets, or reserve a new ticket below.</p>
                    <form class="gate-form" id="magicLinkForm">
                        <input type="email" id="gateEmail" class="gate-input" placeholder="email@example.com" required>
                        <button type="submit" class="gate-btn" id="gateBtn" data-i18n="gate-btn">SEND LINK</button>
                    </form>
                    <div class="gate-msg" id="gateMsg" style="display:none;"></div>
                </div>
            </div>
        </div>

        <div class="event-detail" id="eventDetail" style="display:none;">
            <div class="container">
                <div class="ticket-card-hero" id="ticketCardHero">
                    <div class="tch-flyer" id="tchFlyer" style="display:none;">
                        <img id="tchFlyerImg" alt="Event Flyer">
                    </div>
                    <div class="tch-content">
                        <div class="tch-top">
                            <span class="tch-label" data-i18n="next-event-label">НАСТУПНА ПОДІЯ</span>
                        </div>
                        <div class="tch-date">
                            <span class="tch-day" id="tchDay"></span>
                            <span class="tch-month" id="tchMonth"></span>
                        </div>
                        <h1 class="tch-title" id="tchTitle"></h1>
                        <p class="tch-location" id="tchLocation"></p>
                        <p class="tch-address" id="tchAddress"></p>
                        <div class="tch-price-row">
                            <span class="tch-price" id="tchPrice"></span>
                            <span class="tch-seats" id="tchSeats"></span>
                        </div>
                        <div class="tch-desc" id="tchDesc"></div>
                        <div id="tchAction"></div>
                        <div class="tch-divider"></div>
                        <div class="tch-footer">
                            <span>PROJECT ISKRA</span>
                            <span>MONTRÉAL</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container dash-container">
            <section class="dash-section" id="ticketsSection" style="display:none;">
                <h3 class="dash-section-title" data-i18n="section-tickets">Мої квитки</h3>
                <div class="dash-tickets" id="ticketsList"></div>
            </section>
        </div>
    </div>

    <div class="ticket-modal-overlay" id="ticketModal" style="display:none;">
        <div class="ticket-modal-card">
            <div class="ticket-modal-top">
                <button class="ticket-modal-close" id="ticketModalClose">&times;</button>
                <div class="ticket-modal-header">
                    <div class="ticket-modal-badge" id="ticketModalBadge">ACTIVE</div>
                    <span class="ticket-modal-id" id="ticketModalId"></span>
                </div>
                <div class="ticket-modal-qr-wrap">
                    <div class="ticket-modal-qr-white">
                        <img id="ticketModalQr" alt="QR Code">
                    </div>
                </div>
                <p class="ticket-modal-code" id="ticketModalCode"></p>
            </div>
            <div class="ticket-modal-section" id="ticketModalInfo">
                <h2 class="ticket-modal-event" id="ticketModalEvent"></h2>
                <div class="ticket-modal-detail" id="ticketModalDate"></div>
                <div class="ticket-modal-detail" id="ticketModalLocation"></div>
            </div>
            <div class="ticket-modal-section">
                <div class="ticket-modal-buyer-row">
                    <span class="ticket-modal-buyer-label">ІМ'Я</span>
                    <span class="ticket-modal-buyer-val" id="ticketModalBuyer"></span>
                </div>
                <div class="ticket-modal-buyer-row">
                    <span class="ticket-modal-buyer-label">ЦІНА</span>
                    <span class="ticket-modal-buyer-val" id="ticketModalPrice"></span>
                </div>
            </div>
            <div class="ticket-modal-footer">
                <button class="ticket-modal-save-btn" id="ticketModalSave">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    ЗАВАНТАЖИТИ
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="buyModal" style="display: none;">
        <div class="modal-card" id="buyModalCard">
            <button class="modal-close" id="buyModalClose">&times;</button>
            <h3 class="modal-title" data-i18n="buy-title">Резервація місця</h3>
            <p class="modal-buy-subtitle" data-i18n="buy-subtitle">Введіть свої дані для резервації</p>

            <form class="buy-form" id="buyForm">
                <div class="buy-form-fields">
                    <div class="buy-field">
                        <label for="buyName" data-i18n="buy-label-name">Ім'я</label>
                        <input type="text" id="buyName" placeholder="Ваше ім'я" required maxlength="100">
                    </div>
                    <div class="buy-field">
                        <label for="buyEmail" data-i18n="buy-label-email">Email</label>
                        <input type="email" id="buyEmail" placeholder="email@example.com" required>
                    </div>
                </div>
                <div class="buy-error" id="buyError" style="display:none;"></div>
                <button type="submit" class="modal-buy-btn" id="buySubmitBtn">
                    <span data-i18n="buy-submit">Резервувати</span>
                </button>
            </form>

            <button class="modal-cancel-btn" id="cancelBuyBtn" data-i18n="buy-cancel">Скасувати</button>
        </div>
    </div>

    <script src="/js/qrcode.min.js?v=2"></script>
    <script src="/js/i18n.js?v=2"></script>
    <script src="/js/dashboard.js?v=2"></script>
</body>
</html>
