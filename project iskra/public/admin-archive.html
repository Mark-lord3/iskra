<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Архів подій · Project Iskra Montréal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23e63946'/><text x='16' y='23' font-size='20' font-weight='bold' fill='white' text-anchor='middle'>I</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

<div class="auth-page" id="authGate">
    <div class="auth-card">
        <div class="auth-logo">
            <svg viewBox="0 0 100 100" class="auth-spark">
                <defs>
                    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0057B7"/>
                        <stop offset="100%" stop-color="#FFD700"/>
                    </linearGradient>
                </defs>
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="url(#sg)"/>
            </svg>
        </div>
        <h1 class="auth-title">Project Iskra</h1>
        <p class="auth-sub">Панель адміністратора</p>
        <form id="loginForm" autocomplete="off" novalidate>
            <div class="field-group">
                <label class="field-label" for="loginId">Email або телефон</label>
                <input class="field-input" type="text" id="loginId" placeholder="admin@iskra.ca" required autocomplete="username">
            </div>
            <div class="field-group">
                <label class="field-label" for="loginPw">Пароль</label>
                <div class="pw-wrap">
                    <input class="field-input" type="password" id="loginPw" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="pw-eye" id="pwEye" aria-label="Показати пароль">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="auth-error" id="loginError" role="alert"></div>
            <button class="btn-primary w-full" type="submit" id="loginBtn">Увійти</button>
        </form>
    </div>
</div>

<div class="admin-app" id="adminApp" hidden>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <svg viewBox="0 0 100 100" width="28" height="28">
                <defs><linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0057B7"/><stop offset="100%" stop-color="#FFD700"/></linearGradient></defs>
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="url(#sg2)"/>
            </svg>
            <span class="sidebar-brand">Архів</span>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="/admin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon" width="18" height="18"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                <span>До адмінки</span>
            </a>
            <a class="nav-item" href="/admin/scan">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon" width="18" height="18"><path d="M3 7V5a2 2 0 012-2h2M3 17v2a2 2 0 002 2h2M17 3h2a2 2 0 012 2v2M17 21h2a2 2 0 002-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
                <span>Сканер</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="/" class="sidebar-action">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
                Головна
            </a>
            <button class="sidebar-action danger" id="logoutBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Вийти
            </button>
        </div>
    </aside>

    <div class="main-wrap">
        <header class="topbar" id="topbar">
            <div class="topbar-left">
                <svg viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0">
                    <defs><linearGradient id="sg3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0057B7"/><stop offset="100%" stop-color="#FFD700"/></linearGradient></defs>
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="url(#sg3)"/>
                </svg>
                <span class="topbar-title">Архів подій</span>
            </div>
            <div class="topbar-right">
                <a href="/admin" class="topbar-btn" title="Адмінка">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                </a>
                <button class="topbar-btn danger" id="logoutBtnMob">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <main class="content archive-content">
            <div class="sec-head" style="margin-bottom:16px">
                <h2 class="sec-title">Архів подій</h2>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="search" id="archiveSearch" placeholder="Пошук події...">
                </div>
            </div>

            <div class="archive-layout">
                <aside class="archive-sidebar">
                    <div class="archive-filter-row">
                        <button class="filter-pill active" data-af="all">Всі</button>
                        <button class="filter-pill" data-af="active">Активні</button>
                        <button class="filter-pill" data-af="archived">Архів</button>
                    </div>
                    <div class="archive-event-list" id="archiveEventList">
                        <div class="skeleton-list">
                            <div class="skeleton-item" style="height:48px"></div>
                            <div class="skeleton-item" style="height:48px"></div>
                            <div class="skeleton-item" style="height:48px"></div>
                        </div>
                    </div>
                </aside>

                <div class="archive-detail" id="archiveDetail">
                    <div class="archive-empty" id="archiveEmpty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36" style="opacity:.3;margin-bottom:10px"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                        <div>Оберіть подію зліва,<br>щоб побачити резервації та опитування</div>
                    </div>
                    <div id="archiveContent" hidden>
                        <div class="archive-event-head" id="archiveEventHead"></div>
                        <div class="archive-tabs" id="archiveTabs">
                            <button class="archive-tab active" data-tab="tickets">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 7v2a3 3 0 000 6v2a2 2 0 002 2h14a2 2 0 002-2v-2a3 3 0 000-6V7a2 2 0 00-2-2H5a2 2 0 00-2 2z"/></svg>
                                Резервації <span class="tab-count" id="tabTicketCount"></span>
                            </button>
                            <button class="archive-tab" data-tab="surveys">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                                Опитування <span class="tab-count" id="tabSurveyCount"></span>
                            </button>
                            <button class="archive-tab" data-tab="feedback">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                                Відгуки <span class="tab-count" id="tabFeedbackCount"></span>
                            </button>
                        </div>
                        <div id="tabTickets">
                            <div class="tickets-list" id="archiveTickets"></div>
                        </div>
                        <div id="tabSurveys" hidden>
                            <div class="surveys-list" id="archiveSurveys"></div>
                        </div>
                        <div id="tabFeedback" hidden>
                            <div id="archiveFeedback"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="/js/i18n.js?v=2"></script>
<script src="/js/admin-archive.js?v=2"></script>
</body>
</html>
